<!doctype html>
<html lang="es">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oudrá Parfums</title>
    <meta
      name="description"
      content="Oudrá Parfums: mira el catálogo, síguenos en TikTok o escríbenos por WhatsApp."
    />
    <meta name="theme-color" content="#040404" />
    <meta property="og:title" content="Oudrá Parfums" />
    <meta
      property="og:description"
      content="Los mejores perfumes y la mejor calidad al mejor precio."
    />
    <meta
      property="og:image"
      content="https://oudraparfums.github.io/OudraParfumsWeb/logo.png"
    />
    <meta
      property="og:url"

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #040404;
        --gold-light: #f5e180;
        --gold: #d1ac42;
        --gold-dark: #8a6d25;
        --text: #e9d9a0;
        --gold-gradient: linear-gradient(
          135deg,
          #f5e180 0%,
          #d1ac42 55%,
          #a98530 100%
        );
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px 20px 32px;
        text-align: center;
      }

      main {
        width: 100%;
        max-width: 520px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo {
        width: 180px;
        height: 180px;
        object-fit: contain;
        display: block;
        margin-bottom: 10px;
      }

      .tagline {
        font-size: 1.25rem;
        line-height: 1.5;
        color: var(--text);
        margin: 4px 0 28px;
      }

      .links {
        list-style: none;
        width: 100%;
        display: grid;
        gap: 14px;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        padding: 16px 22px;
        border: 1px solid var(--gold);
        color: var(--gold-light);
        text-decoration: none;
        font-family: inherit;
        font-size: 1.3rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        background: transparent;
        transition:
          background 0.2s ease,
          color 0.2s ease,
          border-color 0.2s ease;
      }

      .btn svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
        flex: none;
      }

      .btn:hover {
        background: rgba(209, 172, 66, 0.12);
        border-color: var(--gold-light);
      }

      .btn:focus-visible {
        outline: 2px solid var(--gold-light);
        outline-offset: 3px;
      }

      .btn-primary {
        background: var(--gold-gradient);
        color: #120e02;
        border-color: transparent;
      }

      .btn-primary:hover {
        background: var(--gold-gradient);
        filter: brightness(1.08);
        border-color: transparent;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        margin: 34px 0 14px;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold-dark));
      }

      .divider::after {
        transform: scaleX(-1);
      }

      .diamond {
        width: 10px;
        height: 10px;
        background: var(--gold-dark);
        transform: rotate(45deg);
      }

      footer {
        font-size: 1rem;
        color: var(--gold-dark);
      }

      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }
      }
    </style>
  </head>

    </main>
  </body>
</html>
